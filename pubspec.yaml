name: student_cabinet_flutter_app
description: Личный кабинет студента для Новоузенского агротехнологического техникума
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.2
  provider: ^6.1.2
  http: ^1.6.0
  excel: ^4.0.6
  file_selector: ^1.1.0
  flutter_secure_storage: ^10.0.0
  supabase_flutter: ^2.0.0
  google_fonts: ^8.0.2
  meta: ^1.11.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
