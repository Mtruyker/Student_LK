<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="description" content="Личный кабинет студента — Новоузенский агротехнологический техникум">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ЛК Студента">
  <meta name="theme-color" content="#10251F">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/campus-180.png">
  <link rel="icon" type="image/png" href="icons/campus-32.png">
  <link rel="manifest" href="manifest.json">
  <title>Личный кабинет студента</title>
  <style>
    html,body { margin:0; min-height:100%; background:#121412; }
    #splash { position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; color:#F4F3DF; background:radial-gradient(ellipse at 50% 36%,#214D3D 0%,#10251F 43%,#101A17 78%); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; transition:opacity .4s ease; }
    #splash::before,#splash::after { content:""; position:absolute; width:560px; height:560px; border:1px solid #c7e9ce0c; border-radius:50%; pointer-events:none; }
    #splash::after { width:690px; height:690px; }
    .brand { position:relative; z-index:1; text-align:center; padding:32px; margin-top:-36px; }
    .brand img { width:112px; height:112px; border-radius:28px; box-shadow:0 24px 64px #0005,0 0 0 1px #ffffff18; }
    .eyebrow { margin:30px 0 12px; font-size:11px; font-weight:600; letter-spacing:4px; color:#BFD6C8; }
    h1 { margin:0; font-size:34px; line-height:1.15; font-weight:600; letter-spacing:-1px; }
    .tagline { margin:18px 0 0; font-size:14px; color:#A7BDB0; letter-spacing:.2px; }
    .progress { width:100px; height:3px; margin:40px auto 16px; background:#ffffff12; border-radius:3px; overflow:hidden; }
    .progress::after { content:""; display:block; width:40px; height:100%; border-radius:3px; background:#DCC78B; animation:loading 1.6s ease-in-out infinite alternate; }
    #load-status { font-size:12px; color:#A7BDB0; }
    .footer { position:absolute; bottom:max(32px,env(safe-area-inset-bottom)); text-align:center; padding:0 24px; color:#809B8C; font-size:10px; line-height:1.7; letter-spacing:1.2px; text-transform:uppercase; }
    #retry { margin:16px auto 0; padding:10px 20px; border:1px solid #A7D8BB55; border-radius:20px; background:#204C3C; color:#F4F3DF; cursor:pointer; }
    #splash.leaving { opacity:0; pointer-events:none; }
    @keyframes loading { from { transform:translateX(0); } to { transform:translateX(60px); } }
    @media(prefers-reduced-motion:reduce) { .progress::after { animation:none; width:100%; } #splash { transition:none; } }
    @media(max-height:550px) { .brand img { width:64px; height:64px; border-radius:18px; } .eyebrow { margin-top:14px; } h1 { font-size:26px; } .progress { margin-top:20px; } .footer { bottom:12px; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="brand">
      <img src="icons/campus-192.png" alt="" width="112" height="112">
      <p class="eyebrow">CAMPUS OS</p>
      <h1>Всё для учёбы.<br>В одном месте.</h1>
      <p class="tagline">Личный кабинет студента</p>
      <div class="progress" aria-hidden="true"></div>
      <div id="load-status">Открываем ваш кабинет</div>
      <button id="retry" hidden onclick="location.reload()">Попробовать снова</button>
      <noscript>Для запуска включите JavaScript в браузере.</noscript>
    </div>
    <div class="footer">Новоузенский<br>агротехнологический техникум</div>
  </div>
  <script>
    const slowLoad = setTimeout(() => {
      document.getElementById('load-status').textContent = 'Загрузка занимает больше времени. Проверьте интернет.';
      document.getElementById('retry').hidden = false;
    }, 25000);
    window.addEventListener('flutter-first-frame', () => {
      clearTimeout(slowLoad);
      const splash = document.getElementById('splash');
      splash.classList.add('leaving');
      setTimeout(() => splash.remove(), 450);
    }, {once:true});
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
